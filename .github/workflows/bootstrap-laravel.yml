name: Bootstrap Laravel Project

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.event.head_commit.message != 'chore: bootstrap laravel project'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, ctype, fileinfo, openssl, pdo, tokenizer, xml
          coverage: none

      - name: Create Laravel application
        run: |
          rm -rf /tmp/mpanel-laravel
          composer create-project laravel/laravel /tmp/mpanel-laravel --no-interaction

      - name: Copy Laravel application
        run: |
          rsync -a --exclude='.git' /tmp/mpanel-laravel/ ./
          touch .gitkeep

      - name: Commit Laravel foundation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: bootstrap laravel project" || exit 0
          git push
